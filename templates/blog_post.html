{% extends "base.html" %}
{% block title %}{{ post.meta.title }}{% endblock %}
{% block content %}
<div class="page container reveal">
  <article class="prose">
    <h1>{{ post.meta.title }}</h1>
    <div class="meta">{{ post.meta.date }}{% if post.meta.tags %} · {{ post.meta.tags|join(', ') }}{% endif %}</div>
    {{ post.html|safe }}
  </article>
</div>
{% endblock %}
